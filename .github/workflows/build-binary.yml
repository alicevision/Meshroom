# .github/workflows/build-binary.yml
# Reusable workflow – called by nightly.yml
#
# Freezes Meshroom (cx_Freeze) with the Python interpreter shipped in the AliceVision nightly bundle, so that
# the binaries embed the same interpreter as AliceVision. Produces two archives with the same top-level folder:
#  - Meshroom-<label>-<os>:      Meshroom only;
#  - Meshroom-<label>-<os>-full: Meshroom with the AliceVision and QtAliceVision nightlies, in the standalone
#                                layout of meshroom.setupEnvironment (aliceVision/, qtPlugins/, python/).
# On Linux, PySide6 is the source build of build-pyside6-linux.yml, never the PyPI wheels (they crash on signal
# emission with this interpreter).
# Any error fails the job: the nightly release is then not updated (see the "release" job of nightly.yml).

name: Build binary

on:
  workflow_call:
    inputs:
      build_label:
        description: "Label appended to the output folder name, e.g. '20240101-abc1234'"
        type: string
        required: true
      os:
        description: "Runner OS: 'ubuntu-22.04' or 'windows-latest'"
        type: string
        required: true
      av_archive:
        description: "AliceVision nightly archive for this platform, providing the Python interpreter (as listed in the Meshroom nightly notes)"
        type: string
        required: true
      qtav_archive:
        description: "QtAliceVision nightly archive for this platform, bundled in the full archive (as listed in the Meshroom nightly notes)"
        type: string
        required: true
      pyside6_cache_key:
        description: "Linux only (required there): cache key of the PySide6 wheels built from source (output of build-pyside6-linux.yml)"
        type: string
        required: false
        default: ''
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: ${{ inputs.os }}

    outputs:
      artifact_name: ${{ steps.set-names.outputs.artifact_name }}

    env:
      ALICEVISION_BUNDLE: ${{ github.workspace }}/../AV_bundle
      QTALICEVISION_BUNDLE: ${{ github.workspace }}/../QTAV_bundle
      PYTHON_VENV: ${{ github.workspace }}/../pyenv
      # Same path as in build-pyside6-linux.yml: it is part of the cache version
      PYSIDE6_WHEELS: ${{ runner.temp }}/pyside6-wheels

    # bash -eo pipefail on every OS: a failing command, including inside a pipe, fails the step
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Compute platform names
        id: set-names
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "platform=windows"          >> "$GITHUB_OUTPUT"
            echo "output_dir=Meshroom-${{ inputs.build_label }}-windows"   >> "$GITHUB_OUTPUT"
            echo "archive=Meshroom-${{ inputs.build_label }}-windows.zip"  >> "$GITHUB_OUTPUT"
            echo "full_archive=Meshroom-${{ inputs.build_label }}-windows-full.zip" >> "$GITHUB_OUTPUT"
            echo "artifact_name=binary-windows"                            >> "$GITHUB_OUTPUT"
            echo "exe_suffix=.exe"                                         >> "$GITHUB_OUTPUT"
          else
            echo "platform=linux"            >> "$GITHUB_OUTPUT"
            echo "output_dir=Meshroom-${{ inputs.build_label }}-linux"     >> "$GITHUB_OUTPUT"
            echo "archive=Meshroom-${{ inputs.build_label }}-linux.tar.gz" >> "$GITHUB_OUTPUT"
            echo "full_archive=Meshroom-${{ inputs.build_label }}-linux-full.tar.gz" >> "$GITHUB_OUTPUT"
            echo "artifact_name=binary-linux"                              >> "$GITHUB_OUTPUT"
            echo "exe_suffix="                                             >> "$GITHUB_OUTPUT"
          fi

      # ── Python of the AliceVision nightly ────────────────────
      # Download the exact archive listed in the Meshroom nightly notes (output of the nightly check). If the
      # AliceVision nightly was republished meanwhile, the download fails and nothing is published: the next
      # hourly check rebuilds against the new one.
      - name: Fetch AliceVision nightly
        env:
          GH_TOKEN: ${{ github.token }}
          AV_ARCHIVE: ${{ inputs.av_archive }}
        run: |
          set -euo pipefail
          if [ -z "$AV_ARCHIVE" ]; then
            echo "::error title=Build binary::Unknown AliceVision nightly archive (could the nightly check read the AliceVision release?)"
            exit 1
          fi
          mkdir -p "$ALICEVISION_BUNDLE"
          echo "Downloading: $AV_ARCHIVE"
          gh release download nightly --repo alicevision/AliceVision --pattern "$AV_ARCHIVE" --dir ..
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -bd -y "../$AV_ARCHIVE" -o"$ALICEVISION_BUNDLE" > /dev/null
          else
            tar -xzf "../$AV_ARCHIVE" -C "$ALICEVISION_BUNDLE" --strip-components=1
          fi
          rm "../$AV_ARCHIVE"

      # QtAliceVision plugins of the full archive, downloaded the same way as the AliceVision nightly. The archive
      # holds a single top-level folder (the QtAliceVision install), moved to QTALICEVISION_BUNDLE.
      - name: Fetch QtAliceVision nightly
        env:
          GH_TOKEN: ${{ github.token }}
          QTAV_ARCHIVE: ${{ inputs.qtav_archive }}
        run: |
          set -euo pipefail
          if [ -z "$QTAV_ARCHIVE" ]; then
            echo "::error title=Build binary::Unknown QtAliceVision nightly archive (could the nightly check read the QtAliceVision release?)"
            exit 1
          fi
          EXTRACT_DIR="${QTALICEVISION_BUNDLE}_extract"
          mkdir -p "$EXTRACT_DIR"
          echo "Downloading: $QTAV_ARCHIVE"
          gh release download nightly --repo alicevision/QtAliceVision --pattern "$QTAV_ARCHIVE" --dir ..
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -bd -y "../$QTAV_ARCHIVE" -o"$EXTRACT_DIR" > /dev/null
          else
            tar -xzf "../$QTAV_ARCHIVE" -C "$EXTRACT_DIR"
          fi
          rm "../$QTAV_ARCHIVE"
          TOP_LEVEL=("$EXTRACT_DIR"/*)
          if [ "${#TOP_LEVEL[@]}" -ne 1 ] || [ ! -d "${TOP_LEVEL[0]}" ]; then
            echo "::error title=Build binary::Expected a single top-level folder in ${QTAV_ARCHIVE}"
            ls "$EXTRACT_DIR"
            exit 1
          fi
          mv "${TOP_LEVEL[0]}" "$QTALICEVISION_BUNDLE"
          rmdir "$EXTRACT_DIR"
          if [ ! -f "${QTALICEVISION_BUNDLE}/qml/AliceVision/qmldir" ]; then
            echo "::error title=Build binary::qml/AliceVision/qmldir missing from ${QTAV_ARCHIVE}"
            exit 1
          fi

      # Venv on top of the interpreter shipped in the AliceVision nightly bundle, as in the AliceVision and
      # QtAliceVision CI: packages go to the venv only, the bundled interpreter stays untouched.
      - name: Setup Python
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUNDLE_PYTHON="${ALICEVISION_BUNDLE}/python/python.exe"
            VENV_BIN="${PYTHON_VENV}/Scripts"
            export PYTHON_ROOT=$(cygpath -w "${ALICEVISION_BUNDLE}/python")
            VENV_DIR=$(cygpath -w "${PYTHON_VENV}")
          else
            BUNDLE_PYTHON="${ALICEVISION_BUNDLE}/python/bin/python3"
            VENV_BIN="${PYTHON_VENV}/bin"
            export PYTHON_ROOT="${ALICEVISION_BUNDLE}/python"
            VENV_DIR="${PYTHON_VENV}"
          fi
          if [ ! -f "$BUNDLE_PYTHON" ]; then
            echo "::error title=Build binary::Python missing from the AliceVision nightly bundle ($BUNDLE_PYTHON)"
            ls "$ALICEVISION_BUNDLE"
            exit 1
          fi
          "$BUNDLE_PYTHON" -I -m venv "$VENV_DIR"
          "$VENV_BIN/python" -c "import os, sys; assert os.path.samefile(sys.base_prefix, os.environ['PYTHON_ROOT']), sys.base_prefix; print(sys.version, sys.base_prefix)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$VENV_BIN" >> "$GITHUB_PATH"
          else
            echo "$VENV_BIN" >> "$GITHUB_PATH"
          fi

      # ── Build ────────────────────────────────────────────────
      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libopengl0 libfontconfig1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0

      # ── PySide6 built from source (Linux) ────────────────────
      # Restored from the cache, or downloaded from the build of this run (cache miss in build-pyside6-linux.yml)
      # and then saved in the cache once validated on this runner (see "Cache PySide6 wheels (Linux)").
      - name: Check PySide6 cache key (Linux)
        if: runner.os == 'Linux'
        env:
          PYSIDE6_CACHE_KEY: ${{ inputs.pyside6_cache_key }}
        run: |
          set -euo pipefail
          if [ -z "$PYSIDE6_CACHE_KEY" ]; then
            echo "::error title=Build binary::Unknown PySide6 wheels cache key (required on Linux: output of build-pyside6-linux.yml)"
            exit 1
          fi

      - name: Restore PySide6 wheels (Linux)
        id: pyside6-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PYSIDE6_WHEELS }}
          key: ${{ inputs.pyside6_cache_key }}

      - name: Download PySide6 wheels (Linux)
        if: runner.os == 'Linux' && steps.pyside6-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: pyside6-linux
          path: ${{ env.PYSIDE6_WHEELS }}

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          # Fail if "python" does not resolve to the venv on top of the AliceVision interpreter
          python -c "import os, sys; assert os.path.samefile(sys.prefix, os.environ['PYTHON_VENV']), sys.prefix"
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" != "Linux" ]; then
            python -m pip install -r requirements.txt -r dev_requirements.txt
            exit 0
          fi

          # Linux: PySide6 built from source, for this interpreter (same version, ABI and build configuration)
          if ! diff <(python -I .github/scripts/pyside6-smoke-test.py --python-info) "${PYSIDE6_WHEELS}/python-info.txt"; then
            echo "::error title=Build binary::PySide6 was built for another Python interpreter than the AliceVision one"
            exit 1
          fi
          python -m pip install --no-index --no-deps "$PYSIDE6_WHEELS"/shiboken6-*.whl "$PYSIDE6_WHEELS"/PySide6-*.whl
          # Other requirements, without PySide6: nothing may pull the PyPI wheels
          grep -viE '^\s*pyside6\b' requirements.txt > "${RUNNER_TEMP}/requirements-linux.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements-linux.txt" -r dev_requirements.txt
          python -m pip list | grep -iE '^(pyside6|shiboken6)'
          # The PyPI PySide6 is a meta package: its modules come from PySide6_Essentials / PySide6_Addons
          if python -m pip list --format=freeze | grep -iE '^pyside6[-_](essentials|addons)=='; then
            echo "::error title=Build binary::PySide6 wheels from PyPI installed"
            exit 1
          fi
          if ! python -m pip show -f PySide6 | grep -qE '^\s*PySide6/QtCore\.'; then
            echo "::error title=Build binary::The installed PySide6 is not the source build"
            exit 1
          fi
          python -I .github/scripts/pyside6-smoke-test.py

      # cache/save stores immediately (not in a post step on success): only once the wheels are validated above
      # with the AliceVision interpreter on this runner. Saved from here, on the runner, so that the path matches
      # the restore and the lookup in build-pyside6-linux.yml.
      - name: Cache PySide6 wheels (Linux)
        if: runner.os == 'Linux' && steps.pyside6-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.PYSIDE6_WHEELS }}
          key: ${{ inputs.pyside6_cache_key }}

      - name: Build executable
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          set -euo pipefail
          python setup.py install_exe -d "$OUTPUT_DIR"

      - name: Remove unused PySide6 files (Windows)
        if: runner.os == 'Windows'
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          set -euo pipefail
          cd "${OUTPUT_DIR}/lib/PySide6"
          find . \( -name 'Qt6Web*.dll' -o -name 'Qt6Designer*.dll' -o -name '*.exe' \) -type f -delete
          rm -rf resources translations typesystems examples include

      - name: Remove unused PySide6 files (Linux)
        if: runner.os == 'Linux'
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          set -euo pipefail
          cd "${OUTPUT_DIR}/lib/PySide6"
          # Qt bundled by the PySide6 source build (--standalone)
          if [ ! -f Qt/lib/libQt6Core.so.6 ]; then
            echo "::error title=Build binary::Qt missing from the frozen PySide6 (${OUTPUT_DIR}/lib/PySide6/Qt/lib/libQt6Core.so.6)"
            exit 1
          fi
          rm -rf resources translations typesystems examples include
          cd Qt/lib
          rm -f \
            *Qt6WebEngine*.so* \
            *Qt6Designer*.so* \
            *Qt6Multimedia*.so* \
            *Qt6SpatialAudio*.so* \
            *Qt6DataVisualization*.so* \
            *Qt6Graphs*.so* \
            *Qt6Bluetooth*.so* \
            *Qt6Nfc*.so* \
            *Qt6SerialPort*.so* \
            *Qt6SerialBus*.so* \
            *Qt6Sensors*.so* \
            *Qt6TextToSpeech*.so* \
            *Qt6VirtualKeyboard*.so* \
            *Qt6WebSockets*.so* \
            *Qt6WebChannel*.so* \
            *Qt6RemoteObjects*.so* \
            *Qt6Scxml*.so* \
            *Qt6StateMachine*.so* \
            *Qt6NetworkAuth*.so*

      - name: Strip debug symbols from .so files (Linux)
        if: runner.os == 'Linux'
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          set -euo pipefail
          # Skip the libraries vendored by wheels (<package>.libs, e.g. numpy.libs): auditwheel already stripped and
          # patchelf'ed them, and strip breaks their segment alignment ("ELF load command address/offset not properly aligned")
          find "$OUTPUT_DIR" -name "*.so*" -not -type l -not -path "*.libs/*" -exec strip --strip-unneeded {} +

      # ── Checks ───────────────────────────────────────────────
      # The frozen command line tools must start with the embedded interpreter (after the cleanup above)
      - name: Smoke test of the frozen binaries
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
          EXE: ${{ steps.set-names.outputs.exe_suffix }}
        run: |
          set -euo pipefail
          for TOOL in meshroom_compute meshroom_batch; do
            echo "── ${TOOL} -h"
            "${OUTPUT_DIR}/${TOOL}${EXE}" -h > /dev/null
          done

      - name: Create archive
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
          ARCHIVE:    ${{ steps.set-names.outputs.archive }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip -bd "$ARCHIVE" "$OUTPUT_DIR" > /dev/null
          else
            tar -czf "$ARCHIVE" "$OUTPUT_DIR"
          fi

      # ── Full archive ─────────────────────────────────────────
      # Add the AliceVision and QtAliceVision nightlies to the frozen Meshroom folder (after the Meshroom-only
      # archive is created), in the standalone layout of meshroom.setupEnvironment, without development files:
      #  - aliceVision/: the AliceVision bundle, except its Python interpreter;
      #  - python/:      the Python interpreter of the AliceVision bundle (copied: the venv is based on it);
      #  - qtPlugins/:   the QtAliceVision install (imageformats/ and qml/).
      - name: Add AliceVision and QtAliceVision
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          set -euo pipefail
          for DIR in aliceVision python qtPlugins; do
            if [ -e "${OUTPUT_DIR}/${DIR}" ]; then
              echo "::error title=Build binary::${OUTPUT_DIR}/${DIR} already exists in the frozen Meshroom folder"
              exit 1
            fi
          done

          mkdir "${OUTPUT_DIR}/aliceVision"
          for ENTRY in "$ALICEVISION_BUNDLE"/*; do
            case "$(basename "$ENTRY")" in
              python|include) ;;
              *) cp -a "$ENTRY" "${OUTPUT_DIR}/aliceVision/" ;;
            esac
          done
          cp -a "${ALICEVISION_BUNDLE}/python" "${OUTPUT_DIR}/python"
          cp -a "${QTALICEVISION_BUNDLE}" "${OUTPUT_DIR}/qtPlugins"

          # Development files: headers, CMake / pkg-config files, import and static libraries
          rm -rf "${OUTPUT_DIR}/qtPlugins/include" \
            "${OUTPUT_DIR}"/aliceVision/lib*/{cmake,pkgconfig} \
            "${OUTPUT_DIR}"/aliceVision/share/{pkgconfig,aliceVision/cmake}
          find "${OUTPUT_DIR}/aliceVision" "${OUTPUT_DIR}/qtPlugins" -type f \( -name '*.lib' -o -name '*.a' \) -delete

          # Windows: share the MSVC runtime bundled by cx_Freeze (include_msvcr, at the root of the frozen folder)
          # with the AliceVision binaries and the bundled Python (for the pyalicevision bindings). A DLL is first
          # searched in the folder of the executable, before System32 (where an older Visual C++ Redistributable
          # could be installed) and PATH, which is not even searched for Python extension modules. The runtime of
          # python/ (vcruntime140*.dll) is replaced, so that a single runtime version is loaded in a process.
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSVC_RUNTIME=()
            for DLL in "${OUTPUT_DIR}"/{concrt140,msvcp140*,vcamp140,vccorlib140,vcomp140,vcruntime140*}.dll; do
              if [ -f "$DLL" ]; then MSVC_RUNTIME+=("$DLL"); fi
            done
            if [ "${#MSVC_RUNTIME[@]}" -eq 0 ]; then
              echo "::error title=Build binary::No MSVC runtime at the root of ${OUTPUT_DIR} (cx_Freeze include_msvcr)"
              exit 1
            fi
            for DIR in aliceVision/bin python; do
              echo "MSVC runtime -> ${DIR}: $(basename -a "${MSVC_RUNTIME[@]}" | tr '\n' ' ')"
              cp -f "${MSVC_RUNTIME[@]}" "${OUTPUT_DIR}/${DIR}/"
            done
          fi

          for REQUIRED in aliceVision/bin aliceVision/share/aliceVision aliceVision/share/meshroom qtPlugins/qml/AliceVision/qmldir; do
            if [ ! -e "${OUTPUT_DIR}/${REQUIRED}" ]; then
              echo "::error title=Build binary::${REQUIRED} missing from the full bundle"
              exit 1
            fi
          done

      # The relocated Python interpreter must still start and, on Windows, load the AliceVision bindings with the
      # MSVC runtime copied next to it
      - name: Smoke test of the bundled Python
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUNDLED_PYTHON="${OUTPUT_DIR}/python/python.exe"
          else
            BUNDLED_PYTHON="${OUTPUT_DIR}/python/bin/python3"
          fi
          "$BUNDLED_PYTHON" -I -c "import sys; print(sys.version, sys.prefix)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYAV_DIR=$(cygpath -wa "${OUTPUT_DIR}/aliceVision/lib/python")
            # Set by meshroom.setupEnvironment at runtime: the bindings fail to initialize without it.
            # Must be absolute: pyalicevision passes <root>/bin to os.add_dll_directory, which rejects relative paths.
            ALICEVISION_ROOT=$(cygpath -wa "${OUTPUT_DIR}/aliceVision") \
              "$BUNDLED_PYTHON" -I -c "import sys; sys.path.insert(0, sys.argv[1]); import pyalicevision; print('pyalicevision:', pyalicevision.__file__)" "$PYAV_DIR"
          fi

      - name: Create full archive
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
          ARCHIVE:    ${{ steps.set-names.outputs.full_archive }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip -bd "$ARCHIVE" "$OUTPUT_DIR" > /dev/null
          else
            tar -czf "$ARCHIVE" "$OUTPUT_DIR"
          fi

      # Integrity of the archives and expected content: a single top-level folder containing the GUI executable,
      # plus AliceVision and QtAliceVision for the full archive (and not for the Meshroom-only one)
      - name: Verify archives
        env:
          OUTPUT_DIR:   ${{ steps.set-names.outputs.output_dir }}
          ARCHIVE:      ${{ steps.set-names.outputs.archive }}
          FULL_ARCHIVE: ${{ steps.set-names.outputs.full_archive }}
          EXE:          ${{ steps.set-names.outputs.exe_suffix }}
        run: |
          set -euo pipefail
          # Arguments: archive, then the entries it must contain
          verifyArchive() {
            local archive="$1" listing topLevel entry
            shift
            test -s "$archive"
            if [ "$RUNNER_OS" = "Windows" ]; then
              unzip -tq "$archive"
              listing=$(unzip -Z1 "$archive")
            else
              listing=$(tar -tzf "$archive")
            fi
            topLevel=$(cut -d/ -f1 <<< "$listing" | sort -u)
            if [ "$topLevel" != "$OUTPUT_DIR" ]; then
              echo "::error title=Build binary::Unexpected top-level content in ${archive}: ${topLevel//$'\n'/ }"
              exit 1
            fi
            for entry in "$@"; do
              grep -qx "${OUTPUT_DIR}/${entry}" <<< "$listing" || {
                echo "::error title=Build binary::${OUTPUT_DIR}/${entry} missing from ${archive}"
                exit 1
              }
            done
            echo "${archive}: $(wc -l <<< "$listing") entries, $(du -h "$archive" | cut -f1)"
            # Listing returned for the caller's extra checks
            LISTING="$listing"
          }

          # MSVC runtime bundled by cx_Freeze (include_msvcr): no Visual C++ Redistributable needed. The full
          # archive shares it with the AliceVision binaries and the bundled Python.
          MSVC_RUNTIME=()
          FULL_MSVC_RUNTIME=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            for DLL in msvcp140.dll msvcp140_1.dll msvcp140_2.dll vcruntime140.dll vcruntime140_1.dll vcomp140.dll; do
              MSVC_RUNTIME+=("$DLL")
              FULL_MSVC_RUNTIME+=("$DLL" "aliceVision/bin/${DLL}" "python/${DLL}")
            done
          fi
          verifyArchive "$ARCHIVE" "Meshroom${EXE}" "${MSVC_RUNTIME[@]}"
          if grep -qE "^${OUTPUT_DIR}/(aliceVision|qtPlugins|python)/" <<< "$LISTING"; then
            echo "::error title=Build binary::${ARCHIVE} must not contain AliceVision, QtAliceVision or Python"
            exit 1
          fi
          verifyArchive "$FULL_ARCHIVE" "Meshroom${EXE}" "qtPlugins/qml/AliceVision/qmldir" "${FULL_MSVC_RUNTIME[@]}"
          for DIR in aliceVision/bin aliceVision/share/meshroom python; do
            grep -q "^${OUTPUT_DIR}/${DIR}/." <<< "$LISTING" || {
              echo "::error title=Build binary::${OUTPUT_DIR}/${DIR}/ missing or empty in ${FULL_ARCHIVE}"
              exit 1
            }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-names.outputs.artifact_name }}
          path: |
            ${{ steps.set-names.outputs.archive }}
            ${{ steps.set-names.outputs.full_archive }}
          retention-days: 1
          if-no-files-found: error
