name: Nightly

on:
  schedule:
    # Hourly check (the "check-changes" job takes a few seconds and skips the build when not needed):
    # rebuild when develop, the AliceVision nightly or the QtAliceVision nightly changed
    - cron: '45 * * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write  # needed to edit releases, upload/delete assets and update "nightly" tag

# Queue (do not cancel) a nightly triggered while another one is running: cancelling a build
# could leave the release half published. GitHub keeps a single pending run per group and
# replaces it with the newest one: this is harmless, as every scheduled run decides whether
# to build from the published state, not from what triggered it.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # Guard: decide whether to build (see .github/scripts/nightly-check.sh).
  # Defaults to no build on any error or unexpected answer.
  # ────────────────────────────────────────────────────────────
  check-changes:
    name: Check whether a nightly build is needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      av_linux:     ${{ steps.check.outputs.av_linux }}
      av_windows:   ${{ steps.check.outputs.av_windows }}
      qtav_linux:   ${{ steps.check.outputs.qtav_linux }}
      qtav_windows: ${{ steps.check.outputs.qtav_windows }}
      short_sha:    ${{ steps.label.outputs.short_sha }}
      build_label:  ${{ steps.label.outputs.build_label }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Compute build label
        id: label
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_label=$(date -u '+%Y.%m.%d')-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Compare with the last nightly and the AliceVision / QtAliceVision nightlies
        id: check
        env:
          GH_TOKEN:   ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/nightly-check.sh

  build-windows:
    name: Build Windows binary
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: windows-latest
      build_label: ${{ needs.check-changes.outputs.build_label }}
      av_archive: ${{ needs.check-changes.outputs.av_windows }}

  build-linux:
    name: Build Linux binary
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ubuntu-22.04
      build_label: ${{ needs.check-changes.outputs.build_label }}
      av_archive: ${{ needs.check-changes.outputs.av_linux }}

  # ────────────────────────────────────────────────────────────
  # Update the single persistent "nightly" pre-release, all-or-nothing
  # (see .github/scripts/nightly-publish.sh): only when both builds
  # succeeded, and the previous nightly stays published until the new
  # archives are fully uploaded.
  # ────────────────────────────────────────────────────────────
  release:
    name: Update nightly release
    needs: [check-changes, build-windows, build-linux]
    if: >-
      needs.check-changes.outputs.should_build == 'true'
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write  # to push git tag nightly

    env:
      SHORT_SHA:    ${{ needs.check-changes.outputs.short_sha }}
      BUILD_LABEL:  ${{ needs.check-changes.outputs.build_label }}
      AV_LINUX:     ${{ needs.check-changes.outputs.av_linux }}
      AV_WINDOWS:   ${{ needs.check-changes.outputs.av_windows }}
      QTAV_LINUX:   ${{ needs.check-changes.outputs.qtav_linux }}
      QTAV_WINDOWS: ${{ needs.check-changes.outputs.qtav_windows }}
      GH_TOKEN:     ${{ github.token }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Publish nightly release
        env:
          DIST_DIR: dist
        run: bash .github/scripts/nightly-publish.sh

      # ── Move the nightly tag to current HEAD ──────
      - name: Re-tag nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Force-update the nightly tag to current HEAD via the GitHub API.
          # This avoids needing git remote auth or being inside a git directory.
          gh api --method PATCH "/repos/${{ github.repository }}/git/refs/tags/nightly" -f sha="${{ github.sha }}" -F force=true || \
          gh api --method POST "/repos/${{ github.repository }}/git/refs" -f ref="refs/tags/nightly" -f sha="${{ github.sha }}"
